mixed-port: 7890
redir-port: 7892
tproxy-port: 7895
allow-lan: true
bind-address: "*"
mode: rule
log-level: warning
ipv6: true
unified-delay: true
tcp-concurrent: true
profile:
  store-selected: false
  store-fake-ip: true
geodata-mode: true
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat
  geosite: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat
  mmdb: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb
sniffer:
  enable: true
  sniff:
    TLS:
      ports:
      - 443
      - 8443
    HTTP:
      ports:
      - 80
      - 8080-8880
      override-destination: true
    QUIC:
      ports:
      - 443
      - 8443
  skip-domain:
  - Mijia Cloud
  - dlg.io.mi.com
  - "+.push.apple.com"
  - "+.googlevideo.com"
  - "+.douyin.com"
  - "+.douyincdn.com"
  - "+.douyinpic.com"
  - "+.douyinstatic.com"
  - "+.douyinliving.com"
  - "+.amemv.com"
  - "+.snssdk.com"
  - "+.byteimg.com"
  - "+.pstatp.com"
  - "+.xiaohongshu.com"
  - "+.xhscdn.com"
  - "+.xhscdn.net"
  - "+.xhslink.com"
  - "+.xhsimg.com"
  - "+.taobao.com"
  - "+.tmall.com"
  - "+.tbcdn.cn"
  - "+.alicdn.com"
  - "+.alibaba.com"
  - "+.alibabausercontent.com"
  - "+.alipay.com"
  - "+.alipayobjects.com"
  - "+.goofish.com"
  - "+.idlefish.com"
  - "+.aliyun.com"
  - "+.aliyuncs.com"
  - "+.mmstat.com"
  - "+.cainiao.com"
  - "+.amap.com"
  - "+.autonavi.com"
  - "+.115.com"
  - "+.115cdn.com"
  - "+.115cdn.net"
  - "+.115img.com"
  - "+.116cd.cn"
  - "+.116cd.com"
  - "+.116cd.net"
  - "+.anxia.com"
  - "+.sq.cc"
  - fhnfile.oss-cn-shenzhen.aliyuncs.com
tun:
  enable: true
  stack: mixed
  mtu: 1492
  dns-hijack:
  - any:53
  - tcp://any:53
  auto-route: true
  auto-detect-interface: true
  strict-route: true

proxies:
- name: xpro-v1
  type: vless
  server:   # 🔴必填：你的节点1 IPv4 地址
  port: 443
  ip-version: ipv4
  udp: true
  uuid:   # 🔴必填：你的 VLESS UUID
  flow: xtls-rprx-vision
  packet-encoding: xudp
  encryption: none
  network: tcp
  tls: true
  servername: www.tesla.com
  client-fingerprint: chrome
  skip-cert-verify: false
  reality-opts:
    public-key:   # 🔴必填：Reality 公钥 (Public Key)
    short-id: 757c2226 # 🔴必填：Reality Short ID

proxy-groups:
- name: PROXY-V1
  type: select
  proxies:
  - AUTO-V1
  - xpro-v1
  - DIRECT
- name: AUTO-V1
  type: url-test
  proxies:
  - xpro-v1
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  lazy: true

dns:
  enable: true
  listen: 0.0.0.0:1053
  cache-algorithm: arc
  ipv6: true
  prefer-ipv6: false
  prefer-h3: false
  use-hosts: true
  use-system-hosts: true
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: fdfe:dcba:9876::1/64
  fake-ip-filter:
  - "*.lan"
  - "*.local"
  - "+.localdomain"
  - localhost.ptlogin2.qq.com
  - time.windows.com
  - time.apple.com
  - time.android.com
  - "+.xn--ngstr-lra8j.com"
  - "+.ntp.org.cn"
  - "+.pool.ntp.org"
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  nameserver-policy:
    "geosite:private,cn,geolocation-cn,apple-cn,microsoft@cn,steam@cn":
    - 223.5.5.5
    - 119.29.29.29
    "+.google.com":
    - https://1.1.1.1/dns-query#PROXY-V1
    - https://dns.google/dns-query#PROXY-V1
    "+.googleapis.com":
    - https://1.1.1.1/dns-query#PROXY-V1
    - https://dns.google/dns-query#PROXY-V1
    "+.googleapis.cn":
    - https://1.1.1.1/dns-query#PROXY-V1
    - https://dns.google/dns-query#PROXY-V1
    "+.gstatic.com":
    - https://1.1.1.1/dns-query#PROXY-V1
    - https://dns.google/dns-query#PROXY-V1
    "+.gvt1.com":
    - https://1.1.1.1/dns-query#PROXY-V1
    - https://dns.google/dns-query#PROXY-V1
    "+.gvt2.com":
    - https://1.1.1.1/dns-query#PROXY-V1
    - https://dns.google/dns-query#PROXY-V1
    "+.gvt3.com":
    - https://1.1.1.1/dns-query#PROXY-V1
    - https://dns.google/dns-query#PROXY-V1
    "+.googleusercontent.com":
    - https://1.1.1.1/dns-query#PROXY-V1
    - https://dns.google/dns-query#PROXY-V1
    "+.ggpht.com":
    - https://1.1.1.1/dns-query#PROXY-V1
    - https://dns.google/dns-query#PROXY-V1
    "+.android.com":
    - https://1.1.1.1/dns-query#PROXY-V1
    - https://dns.google/dns-query#PROXY-V1
    "+.xn--ngstr-lra8j.com":
    - https://1.1.1.1/dns-query#PROXY-V1
    - https://dns.google/dns-query#PROXY-V1
    "+.openai.com":
    - https://1.1.1.1/dns-query#PROXY-V1
    - https://dns.google/dns-query#PROXY-V1
    "+.chatgpt.com":
    - https://1.1.1.1/dns-query#PROXY-V1
    - https://dns.google/dns-query#PROXY-V1
    "+.anthropic.com":
    - https://1.1.1.1/dns-query#PROXY-V1
    - https://dns.google/dns-query#PROXY-V1
    "+.claude.ai":
    - https://1.1.1.1/dns-query#PROXY-V1
    - https://dns.google/dns-query#PROXY-V1
    "geosite:geolocation-!cn":
    - https://1.1.1.1/dns-query#PROXY-V1
    - https://dns.google/dns-query#PROXY-V1
  nameserver:
  - https://1.1.1.1/dns-query#PROXY-V1
  - https://1.0.0.1/dns-query#PROXY-V1
  - https://dns.google/dns-query#PROXY-V1
  fallback:
  - https://1.1.1.1/dns-query#PROXY-V1
  - https://dns.google/dns-query#PROXY-V1
  proxy-server-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  direct-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  direct-nameserver-follow-policy: true
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
    - 240.0.0.0/4

rules:
# 核心优化：强制阿里系应用放弃 QUIC (UDP 443)，瞬间回退 TCP 解决转圈慢的问题
- AND,((NETWORK,UDP),(DST-PORT,443),(GEOSITE,alibaba)),REJECT

# 泄漏测试站点强制走代理，避免 geosite 误判为国内直连
- DOMAIN-SUFFIX,browserleaks.com,PROXY-V1
- DOMAIN-SUFFIX,browserleaks.org,PROXY-V1
- DOMAIN-SUFFIX,browserleaks.net,PROXY-V1
- DOMAIN-SUFFIX,dnsleaktest.com,PROXY-V1
- DOMAIN-SUFFIX,ipleak.net,PROXY-V1

- GEOSITE,private,DIRECT

# 核心优化：阿里系服务直连 (替代原本冗长的 DOMAIN-SUFFIX，涵盖更全)
- GEOSITE,alibaba,DIRECT

# 115 专属直连
- DOMAIN-SUFFIX,115.com,DIRECT
- DOMAIN-SUFFIX,115cdn.com,DIRECT
- DOMAIN-SUFFIX,115cdn.net,DIRECT
- DOMAIN-SUFFIX,115img.com,DIRECT
- DOMAIN-SUFFIX,116cd.cn,DIRECT
- DOMAIN-SUFFIX,116cd.com,DIRECT
- DOMAIN-SUFFIX,116cd.net,DIRECT
- DOMAIN-SUFFIX,anxia.com,DIRECT
- DOMAIN-SUFFIX,sq.cc,DIRECT
- DOMAIN,fhnfile.oss-cn-shenzhen.aliyuncs.com,DIRECT

# 局域网与私有 IP 放行
- IP-CIDR6,::1/128,DIRECT,no-resolve
- IP-CIDR6,fc00::/7,DIRECT,no-resolve
- IP-CIDR6,fe80::/10,DIRECT,no-resolve
- IP-CIDR6,ff00::/8,DIRECT,no-resolve
- IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
- IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
- IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
- IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
- IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
- IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
- IP-CIDR,224.0.0.0/4,DIRECT,no-resolve
- IP-CIDR,240.0.0.0/4,DIRECT,no-resolve

# 代理规则 (AI 品牌与 Google 核心服务)
- DOMAIN-SUFFIX,openai.com,PROXY-V1
- DOMAIN-SUFFIX,chatgpt.com,PROXY-V1
- DOMAIN-SUFFIX,anthropic.com,PROXY-V1
- DOMAIN-SUFFIX,claude.ai,PROXY-V1
- DOMAIN-SUFFIX,google.com,PROXY-V1
- DOMAIN-SUFFIX,googleapis.com,PROXY-V1
- DOMAIN-SUFFIX,googleapis.cn,PROXY-V1
- DOMAIN-SUFFIX,gstatic.com,PROXY-V1
- DOMAIN-SUFFIX,gvt1.com,PROXY-V1
- DOMAIN-SUFFIX,gvt2.com,PROXY-V1
- DOMAIN-SUFFIX,gvt3.com,PROXY-V1
- DOMAIN-SUFFIX,googleusercontent.com,PROXY-V1
- DOMAIN-SUFFIX,ggpht.com,PROXY-V1
- DOMAIN-SUFFIX,android.com,PROXY-V1
- DOMAIN-SUFFIX,xn--ngstr-lra8j.com,PROXY-V1

# 基础规则集匹配
- GEOSITE,google,PROXY-V1
- GEOSITE,youtube,PROXY-V1
- GEOSITE,telegram,PROXY-V1
- GEOSITE,github,PROXY-V1
- GEOSITE,category-games@cn,DIRECT
- GEOSITE,apple-cn,DIRECT
- GEOSITE,apple,DIRECT
- GEOSITE,microsoft@cn,DIRECT
- GEOSITE,steam@cn,DIRECT
- DOMAIN-SUFFIX,cn,DIRECT
- DOMAIN-SUFFIX,中国,DIRECT
- DOMAIN-SUFFIX,公司,DIRECT
- DOMAIN-SUFFIX,网络,DIRECT

# 国内与国外保底分流规则
- GEOSITE,cn,DIRECT
- GEOSITE,geolocation-cn,DIRECT
- GEOIP,CN,DIRECT,no-resolve
- GEOSITE,geolocation-!cn,PROXY-V1
- MATCH,PROXY-V1
